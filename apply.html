<h2>Apply for an Account</h2>
    
    <!-- The form uses onsubmit to intercept the action and run JavaScript -->
    <form id="loginForm" onsubmit="validateLogin(event)">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required placeholder="Enter Username">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required placeholder="Enter Password">
        </div>
        
        <button type="submit">Login</button>
    </form>

    <script>
        function validateLogin(event) {
            // Prevent the form from submitting and refreshing the page automatically
            event.preventDefault(); 
            
            // Get the values entered by the user
            const userField = document.getElementById("username").value;
            const passField = document.getElementById("password").value;
            
            // Define your correct credentials
            const correctUsername = "Grant Hereman";
            const correctPassword = "NIOLDPD";
            
            // Validate the credentials
            if (userField === correctUsername && passField === correctPassword) {
                // If correct, redirect the user to the destination HTML page
                window.location.href = "archives.html";
            } else {
                // If incorrect, show an error alert
                alert("ERROR 101: Cannot apply account, please try again later.");
            }
        }
    </script>
